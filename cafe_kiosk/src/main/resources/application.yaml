spring:
  application:
    name: cafe_kiosk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cafe_kios_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: cafe_owner
    password: cafe_owner123
  jpa:
    hibernate:
      ddl-auto: update # Entity ? ????? ??? ???? ??????? ???? ?????.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect
  mvc:
    throw-exception-if-no-handler-found: true # @ExceptionHandler ?? ????? ???
  web:
    resources:
      add-mappings: false # 404.html ?? ?? ??

server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true